<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <linearGradient id="rvGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="rvBadgeBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="rvAccentDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>
  </defs>

  <!-- LOGO MARK (Left Badge) -->
  <g transform="translate(10, 10)">
    <rect width="100" height="100" rx="22" fill="url(#rvBadgeBgDark)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Subtle Grid Lines -->
    <path d="M15 80 L85 80 M15 65 L85 65 M15 50 L85 50" stroke="#475569" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.4" />
    
    <!-- R Pillar & Curve (Pure White) -->
    <path d="M 27 25 L 38 25 L 38 75 L 27 75 Z" fill="#FFFFFF" />
    <path d="M 38 25 L 56 25 C 65 25 71 31 71 40 C 71 49 65 54 55 54 L 38 54 Z M 38 35 L 53 35 C 57 35 60 37 60 40 C 60 43 57 45 53 45 L 38 45 Z" fill="#FFFFFF" />
    
    <!-- Dynamic V Forward Vision Vector (Vibrant Cyan-Mint Gradient) -->
    <path d="M 44 48 L 58 75 L 69 75 L 81 33 L 70 33 L 64 61 L 54 44 Z" fill="url(#rvGradDark)" />
    
    <!-- Vision Beacon (Glowing Amber) -->
    <circle cx="81" cy="27" r="4.5" fill="url(#rvAccentDark)" />
    <path d="M 81 17 L 81 21 M 72 23 L 75 25 M 87 28 L 90 30" stroke="#FDE047" stroke-width="1.4" stroke-linecap="round" opacity="0.9" />
  </g>

  <!-- TYPOGRAPHY / LOGOTYPE (Right) -->
  <g transform="translate(130, 26)">
    <!-- Primary Brand Wordmark -->
    <text x="0" y="44" font-family="'Outfit', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="46" letter-spacing="-0.03em" fill="#FFFFFF">
      RV <tspan fill="url(#rvGradDark)" font-weight="800">FACILITIES</tspan>
    </text>

    <!-- Corporate Entity Subtitle -->
    <text x="2" y="66" font-family="'Outfit', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" letter-spacing="0.24em" fill="#94A3B8">
      RADICAL VISION FACILITIES PVT. LTD.
    </text>

    <!-- Provenance & Capabilities -->
    <g transform="translate(2, 78)">
      <rect x="0" y="0" width="82" height="18" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="7" y="13" font-family="'Outfit', 'DM Sans', sans-serif" font-weight="700" font-size="9.5" letter-spacing="0.08em" fill="#2DD4BF">
        ESTD. 2006
      </text>
      
      <circle cx="94" cy="9" r="2" fill="#64748B" />

      <text x="104" y="13" font-family="'DM Sans', 'Outfit', sans-serif" font-weight="600" font-size="10.5" letter-spacing="0.06em" fill="#CBD5E1">
        Pune • Chakan • Hinjewadi • Maharashtra
      </text>
    </g>
  </g>
</svg>
