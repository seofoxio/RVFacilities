<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="rvPrimaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="rvNavyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="rvAccentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <filter id="rvShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Base Hexagonal Shield Container -->
  <rect width="120" height="120" rx="26" fill="url(#rvNavyGrad)" />
  
  <!-- Subtle Architectural Grid Background -->
  <path d="M20 95 L100 95 M20 80 L100 80 M20 65 L100 65" stroke="#334155" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.4" />
  <path d="M35 100 L35 25 M60 100 L60 25 M85 100 L85 25" stroke="#334155" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.4" />

  <!-- The "R" Pillar & Loop (Solid Trust & Structure) -->
  <g filter="url(#rvShadow)">
    <!-- R Left Vertical Structural Pillar -->
    <path d="M 32 30 
             L 45 30 
             L 45 88 
             L 32 88 
             Z" 
          fill="#FFFFFF" />
    
    <!-- R Upper Geometric Curve / Facility Wing -->
    <path d="M 45 30 
             L 66 30 
             C 77 30 83 37 83 47 
             C 83 57 76 63 65 63 
             L 45 63 
             Z
             M 45 42 
             L 63 42 
             C 68 42 71 44 71 47 
             C 71 50 68 52 63 52 
             L 45 52 
             Z" 
          fill="#FFFFFF" />
    
    <!-- Dynamic "V" - Forward Vision Arrow & Tower Chevron (Teal to Emerald Gradient) -->
    <path d="M 52 56 
             L 68 88 
             L 81 88 
             L 94 40 
             L 81 40 
             L 74 72 
             L 63 52 
             Z" 
          fill="url(#rvPrimaryGrad)" />

    <!-- Vision Apex Dot / Tower Beacon (Amber Gold) -->
    <circle cx="94" cy="33" r="4.5" fill="url(#rvAccentGrad)" />
    <path d="M 94 22 L 94 26 M 85 30 L 88 32 M 100 35 L 103 36" stroke="#FBBF24" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
  </g>
</svg>
